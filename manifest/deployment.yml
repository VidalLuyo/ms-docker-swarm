# kubectl apply -f 4-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-prueba
  namespace: vidal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-prueba        # Debe coincidir con las etiquetas del Service
  template:
    metadata:
      labels:
        app: app-prueba      # Debe coincidir con las etiquetas del Service
    spec:
      containers:
      - name: app-prueba
        image: vidalluyo0/app-prueba:latest   # Reemplaza con tu imagen Docker Hub
        imagePullPolicy: IfNotPresent        # Evitar traer siempre la última versión si hay una actual
        envFrom:
        - secretRef:
            name: credentials  # Esto cargará todos los valores como variables de entorno